# Pinned project name (#130): keeps the derived project (and with it the
# claude-agent-sdk-cl-cache volume prefix) identical to the pre-move layout
# now that this compose file lives in harness/ instead of the repo root.
name: claude-agent-sdk-cl

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: claude-agent-sdk-cl:test
    working_dir: /workspace
    network_mode: none
    volumes:
      # Mount only runtime source. In particular, harness/.env is never visible
      # to offline tests and cannot be copied into the image by .dockerignore.
      - ./claude-agent-sdk-cl.asd:/workspace/claude-agent-sdk-cl.asd:ro
      - ./src:/workspace/src:ro
      - ./test:/workspace/test:ro
      - ./scripts:/workspace/scripts:ro
      - ./examples:/workspace/examples:ro
      - ./sm-harness:/workspace/sm-harness:ro
      - claude-agent-sdk-cl-cache:/cache
    command: ["unit"]

  sm-harness-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: claude-agent-sdk-cl:test
    working_dir: /workspace
    network_mode: none
    volumes:
      - ./claude-agent-sdk-cl.asd:/workspace/claude-agent-sdk-cl.asd:ro
      - ./src:/workspace/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./sm-harness:/workspace/sm-harness:ro
      - claude-agent-sdk-cl-cache:/cache
    command: ["sm-harness"]

  sm-harness-presenter-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: claude-agent-sdk-cl:test
    working_dir: /workspace
    network_mode: none
    volumes:
      - ./claude-agent-sdk-cl.asd:/workspace/claude-agent-sdk-cl.asd:ro
      - ./src:/workspace/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./sm-harness:/workspace/sm-harness:ro
      - ./sm-harness-web-ui:/workspace/sm-harness-web-ui:ro
      - claude-agent-sdk-cl-cache:/cache
    command: ["sm-harness-presenter"]

  live:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: claude-agent-sdk-cl:test
    working_dir: /workspace
    # Intentionally no network_mode: none: this is the sole opt-in provider
    # smoke boundary. It mounts source/scripts only, never harness/.env.
    environment:
      CLAUDE_SDK_LIVE_TEST: ${CLAUDE_SDK_LIVE_TEST:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ./claude-agent-sdk-cl.asd:/workspace/claude-agent-sdk-cl.asd:ro
      - ./src:/workspace/src:ro
      - ./scripts:/workspace/scripts:ro
      - claude-agent-sdk-cl-cache:/cache
    command: ["live"]

  reference:
    build:
      context: .
      dockerfile: Dockerfile
      target: reference
    image: claude-agent-sdk-cl:reference
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./test/fixtures/upstream:/out
    command: ["/opt/catalog/upstream-catalog.json", "/out/reference-catalog.json"]

volumes:
  claude-agent-sdk-cl-cache:
