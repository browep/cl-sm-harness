services:
  web-ui:
    build:
      context: .
      dockerfile: sm-harness-web-ui/Dockerfile
    image: sm-harness-web-ui:local
    # Matches the host repo owner so the /app bind mount below is writable
    # (#90); the image's app user is built with this uid.
    user: "1000:1000"
    environment:
      SM_HARNESS_DATA: /data
      SM_HARNESS_HOST: 0.0.0.0
      SM_HARNESS_PORT: "8080"
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Consumed by gh's credential-helper wiring (sm-harness-web-ui/Dockerfile)
      # so plain git/gh operations against github.com authenticate automatically.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Consumed by the web_search tool (#112, sm-harness/src/tool-catalog.lisp)
      # to call the Tavily search API; unset -> the tool reports a safe
      # tool-result error instead of crashing.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      # Live repo at /app (#90): write_file/reload_harness edits persist on
      # the host instead of dying with the container. CLOG static assets are
      # baked at /opt/app-static so this mount cannot shadow them.
      - .:/app
      - sm-harness-data:/data
      - sm-harness-cache:/cache
    ports:
      # Direct tailnet endpoint; avoids Caddy path rewriting for CLOG's
      # root-relative HTTP, WebSocket, CSS, and JavaScript routes.
      - "100.65.98.70:17881:8080"
    healthcheck:
      test: ["CMD", "sbcl", "--non-interactive", "--eval", "(quit)"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-ui-e2e-app:
    build:
      context: .
      dockerfile: sm-harness-web-ui/Dockerfile
    image: sm-harness-web-ui:local
    user: "1000:1000"
    environment:
      SM_HARNESS_DATA: /data
      SM_HARNESS_HOST: 0.0.0.0
      SM_HARNESS_PORT: "8080"
      WEB_UI_E2E: "1"
      E2E_SCENARIO: ${E2E_SCENARIO:-}
      CL_SOURCE_REGISTRY: /app//
    volumes:
      - sm-harness-e2e-data:/data
      - sm-harness-cache:/cache
      - ./claude-agent-sdk-cl.asd:/app/claude-agent-sdk-cl.asd:ro
      - ./src:/app/src:ro
      - ./sm-harness:/app/sm-harness:ro
      - ./sm-harness-web-ui:/app/sm-harness-web-ui:ro
    networks:
      - e2e
    expose:
      - "8080"

  web-ui-e2e:
    build:
      context: ./sm-harness-web-ui/e2e
      dockerfile: Dockerfile
    image: sm-harness-web-ui-e2e:local
    volumes:
      # Host bind mount keeps browser evidence available to Caddy immediately.
      - ${E2E_ARTIFACTS_DIR:-./evidence/sm-harness-web-ui-e2e/latest}:/artifacts
    environment:
      BASE_URL: http://web-ui-e2e-app:8080
      ARTIFACTS: /artifacts
      E2E_SCENARIO: ${E2E_SCENARIO:-}
    depends_on:
      - web-ui-e2e-app
    networks:
      - e2e

networks:
  e2e:
    internal: true

volumes:
  sm-harness-data:
  sm-harness-e2e-data:
  sm-harness-cache:
  sm-harness-e2e-artifacts:
